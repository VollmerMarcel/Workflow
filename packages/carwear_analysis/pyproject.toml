[project]
name = "carwear-analysis"
version = "0.1.0"
description = "Aggregate engine output across design points"
requires-python = ">=3.12"
dependencies = [
    "carwear-core",
    "pandas>=2.2",
    "pyarrow>=18.0",
    "scipy>=1.14",
]

[tool.uv.sources]
carwear-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carwear_analysis"]
