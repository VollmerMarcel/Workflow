[project]
name = "carwear-dashboard"
version = "0.1.0"
description = "Streamlit dashboard for carwear study artifacts"
requires-python = ">=3.12"
dependencies = [
    "carwear-core",
    "pandas>=2.2",
    "plotly>=5.24",
    "pyarrow>=18.0",
    "streamlit>=1.40",
]

[tool.uv.sources]
carwear-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carwear_dashboard"]
