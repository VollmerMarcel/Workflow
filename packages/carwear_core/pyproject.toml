[project]
name = "carwear-core"
version = "0.1.0"
description = "Shared models and artifact layout for the carwear workflow"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carwear_core"]
