[project]
name = "carwear-study"
version = "0.1.0"
description = "Study definitions, design expansion, and engine case generation"
requires-python = ">=3.12"
dependencies = [
    "carwear-core",
    "numpy>=2.1",
    "tomli-w>=1.2",
]

[tool.uv.sources]
carwear-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carwear_study"]
